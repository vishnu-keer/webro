# WEBRO review helper API — Cloudflare Worker.
#
# The website itself stays on GitHub Pages (static). This Worker is the only
# piece that runs server-side, and it is the only place the Gemini key exists.
#
# Secrets are NEVER written in this file:
#   production: npx wrangler secret put GEMINI_API_KEY
#   local dev:  copy .dev.vars.example to .dev.vars (gitignored)

name = "webro-review-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Public URL: https://webro-review-api.webro-review-helper.workers.dev
workers_dev = true
# No per-version preview URLs — one public endpoint only.
preview_urls = false

# Never ship source maps — they are not needed and would reveal source.
upload_source_maps = false

[vars]
# Model is configurable without a code change.
GEMINI_MODEL = "gemini-3.8-flash"
# Used automatically only if the main model times out, is overloaded or out of quota.
GEMINI_FALLBACK_MODEL = "gemini-2.5-flash"
# Only these sites may call the API from a browser. Comma-separated.
ALLOWED_ORIGINS = "https://webro.studio,https://www.webro.studio,http://localhost:4321"

# Per-visitor limit: 5 drafts per minute per IP, counted per Cloudflare location.
[[ratelimits]]
name = "PER_IP_LIMITER"
namespace_id = "2401"
simple = { limit = 5, period = 60 }

# Whole-site ceiling: protects the Gemini free quota from a burst of abuse.
[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "2402"
simple = { limit = 10, period = 60 }

[observability]
# Logs contain only event names and status codes — never review text.
enabled = true
